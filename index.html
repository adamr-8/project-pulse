<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Pulse — eBusiness Program Dashboard</title>
<style>
:root {
  --bg:#001A0C; --panel:#1A2E22; --panel-mid:#22382A; --panel-light:#2E4A38;
  --border:#3A5C47; --accent:#00A651; --amber:#F4A922;
  --white:#EDF2F7; --dim:#8FAF9A;
  --green:#22C55E; --yellow:#FACC15; --orange:#F97316; --red:#EF4444;
  --r:6px; --g:8px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg); color:var(--white);
  width:100vw; height:100vh; overflow:hidden;
  display:grid; grid-template-rows: auto auto auto 1fr;
  gap:var(--g); padding:var(--g);
}
#header {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r); padding:8px 18px;
}
.logo-wrap svg { height:38px; width:auto; display:block; }
.hdr-title { font-size:20px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; text-align:center; }
.hdr-sub { font-size:12px; color:var(--dim); margin-top:2px; text-align:center; }
.hdr-right { text-align:right; }
.hdr-date { font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
#live-clock { font-size:13px; font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:2px; }

#charters { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--g); row-gap:12px; min-height:0; }

.charter-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); display:flex; flex-direction:column; overflow:hidden; }

.sentiment-banner { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
.big-dot { width:16px; height:16px; border-radius:50%; flex-shrink:0; }
.sentiment-word { font-size:12px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
.phase-chip { margin-left:auto; font-size:9px; letter-spacing:1.2px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:20px; background:rgba(244,169,34,0.15); color:var(--amber); border:1px solid rgba(244,169,34,0.4); flex-shrink:0; white-space:nowrap; }

.sent-green  .big-dot { background:var(--green);  box-shadow:0 0 8px var(--green);  }
.sent-yellow .big-dot { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
.sent-orange .big-dot { background:var(--orange); box-shadow:0 0 8px var(--orange); }
.sent-red    .big-dot { background:var(--red);    box-shadow:0 0 8px var(--red);    }
.sent-green  .sentiment-word { color:var(--green);  }
.sent-yellow .sentiment-word { color:var(--yellow); }
.sent-orange .sentiment-word { color:var(--orange); }
.sent-red    .sentiment-word { color:var(--red);    }

.card-body { padding:14px 16px; display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; overflow:hidden; }
.charter-name { font-size:15px; font-weight:900; letter-spacing:1px; text-transform:uppercase; line-height:1.25; }
.charter-lead { font-size:11px; color:var(--dim); margin-top:2px; }

.blurb-block { background:var(--panel-mid); border-left:3px solid var(--accent); border-radius:0 4px 4px 0; padding:7px 10px; flex-shrink:0; }
.blurb-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
.blurb-text  { font-size:12px; max-height:4.8em; overflow:hidden; font-style:italic; color:var(--white); line-height:1.6; }

.task-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; flex-shrink:0; }
.task-cell { background:var(--panel-light); border-radius:4px; padding:4px 3px; text-align:center; }
.task-count { font-size:22px; font-weight:900; line-height:1; }
.task-label { font-size:8px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); margin-top:1px; }
.c-done    { color:var(--green);  }
.c-active  { color:var(--accent); }
.c-delayed { color:var(--orange); }
.c-todo    { color:var(--dim);    }

.progress-wrap { flex-shrink:0; }
.progress-meta { display:flex; justify-content:space-between; margin-bottom:3px; }
.progress-label { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
.progress-pct   { font-size:11px; font-weight:700; color:var(--accent); }
.progress-bar   { height:4px; background:var(--panel-light); border-radius:2px; overflow:hidden; }
.progress-fill  { height:100%; border-radius:2px; background:var(--accent); }

.new-tasks { flex:1; min-height:0; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
.new-tasks-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--border); padding-bottom:3px; flex-shrink:0; }
.task-list { overflow:hidden; display:flex; flex-direction:column; gap:3px; }
.task-item { font-size:11px; color:var(--white); line-height:1.4; padding:2px 0 2px 12px; position:relative; }
.task-item::before { content:''; position:absolute; left:0; top:7px; width:4px; height:4px; border-radius:50%; background:var(--accent); }
.task-item.none { color:var(--dim); font-style:italic; }
.task-item.none::before { display:none; }

#top-row { display:grid; grid-template-columns:1fr 1.6fr; gap:var(--g); padding:2px 0; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; }
.p-title { font-size:11px; letter-spacing:2.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.p-title::after { content:''; flex:1; height:1px; background:var(--border); }

#ae-panel { display:flex; flex-direction:column; }
.ae-phase { font-size:13px; font-weight:700; margin-bottom:4px; }
.ae-row   { display:flex; align-items:flex-end; gap:8px; margin-bottom:4px; }
.ae-pct   { font-size:32px; font-weight:900; color:var(--amber); line-height:1; }
.ae-sub   { font-size:11px; color:var(--dim); padding-bottom:2px; }
.ae-bar   { height:5px; background:var(--panel-light); border-radius:3px; overflow:hidden; margin-bottom:6px; }
.ae-fill  { height:100%; border-radius:3px; background:var(--amber); }
.ae-stats { display:flex; gap:10px; flex-wrap:wrap; }
.ae-stat  { font-size:10px; color:var(--dim); }
.ae-stat strong { color:var(--white); display:block; font-size:11px; }
.on-track { color:var(--green) !important; }
.ae-gate { font-size:11px; padding:4px 8px; margin-top:auto; background:var(--panel-mid); border-left:2px solid var(--amber); border-radius:0 3px 3px 0; color:var(--dim); }
.ae-gate strong { color:var(--amber); }

#tl-panel { display:flex; flex-direction:column; }
.tl-track { position:relative; flex:1; display:flex; align-items:center; padding:0 10px; }
.tl-line  { position:absolute; left:20px; right:20px; height:2px; background:var(--border); top:50%; transform:translateY(-50%); }
.track-progress { position:absolute; left:20px; height:2px; background:var(--accent); top:50%; transform:translateY(-50%); }
.milestones { position:relative; display:flex; justify-content:space-between; width:100%; z-index:1; }
.milestone  { display:flex; flex-direction:column; align-items:center; gap:4px; }
.milestone-dot { width:10px; height:10px; border-radius:50%; border:2px solid var(--border); background:var(--bg); }
.milestone-dot.done    { background:var(--accent); border-color:var(--accent); box-shadow:0 0 6px var(--accent); }
.milestone-dot.current { background:var(--amber);  border-color:var(--amber);  animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 4px var(--amber)} 50%{box-shadow:0 0 14px var(--amber)} }
.milestone-name { font-size:9px; font-weight:600; text-transform:uppercase; color:var(--dim); text-align:center; max-width:62px; line-height:1.3; }
.milestone-name.done    { color:var(--accent); }
.milestone-name.current { color:var(--amber);  }
.milestone-date { font-size:9px; color:var(--border); text-align:center; }
.milestone-date.done    { color:var(--accent); opacity:.6; }
.milestone-date.current { color:var(--amber);  opacity:.8; }

#footer { display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--border); border-radius:var(--r); padding:5px 14px; }
.sk { display:flex; gap:14px; align-items:center; }
.sk-lbl  { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin-right:4px; }
.sk-item { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); }
.sk-dot  { width:8px; height:8px; border-radius:50%; }
.f-note  { font-size:9px; color:var(--dim); font-style:italic; opacity:.6; }

</style>
</head>

  </div>
  <div class="panel" id="tl-panel">
    <div class="p-title">Program Timeline</div>
    <div class="tl-track">
      <div class="tl-line"></div>
      <div class="track-progress" id="track-progress"></div>
      <div class="milestones" id="milestones"></div>
    </div>
  </div>
</div>

<div id="charters"></div>

<script>
var DATA = {
  meta: { weekLabel: "Week of Mar 5, 2026", dataDate: "Data as of Mar 5, 2026" },
  charters: [
    { name: "Ship-To & Contact", lead: "Richard Duboise", sentiment: "yellow", sentimentWord: "Review",
      done: 2, active: 0, delayed: 0, todo: 15, startDate: "Feb 24", endDate: "Mar 28",
      blurb: "Groundwork kicking off this week — pulling contact and ship-to lists for all 10 pilot customers, and establishing the required fields for e-comm checkout.",
      newTasks: ["Establish fields needed for E-Comm Contact", "Pull contact & ship-to lists for pilot customers", "Delegate information gathering"] },
    { name: "Item Descriptions", lead: "Richard Duboise", sentiment: "green", sentimentWord: "Current",
      done: 2, active: 1, delayed: 0, todo: 5, startDate: "Feb 19", endDate: "Mar 28",
      blurb: "First cleanup assignment is live — Eric, Austin, and Craig working through dot and slash description fixes. Description rules being defined in parallel this week.",
      newTasks: ["Assignment 1: eliminate dot/slash descriptions", "Create rules for what a good description looks like"] },
    { name: "Weights & Dimensions", lead: "James Haire", sentiment: "yellow", sentimentWord: "Review",
      done: 5, active: 0, delayed: 0, todo: 23, startDate: "Feb 19", endDate: "Apr 17",
      blurb: "Clean starting data set secured from Wesley this week — unblocking the next phase. UOM tagging and supplier query work queued and ready to begin.",
      newTasks: ["Tag starting data set items with UPDATES class"] },
    { name: "Pricing", lead: "James Haire", sentiment: "yellow", sentimentWord: "Review",
      done: 8, active: 5, delayed: 1, todo: 10, startDate: "Feb 19", endDate: "Apr 17",
      blurb: "Library discovery meeting surfaced many findings. Five tasks actively in progress across library structure and contracts vetting. One item delayed pending corrected source data.",
      newTasks: ["Address new issues from Library discovery", "Set up Libraries in P21", "Vet if existing contracts apply to pilot customers"] }
  ],
  americanEagle: {
    phase: "Discovery & Design — Sessions 1–4 Active", completePct: 25,
    hoursRemaining: 278, hoursTotal: 310,
    schedule: "On Track", scope: "On Track", budget: "On Track",
    lead: "Wesley Crouch",
    gateLabel: "McGill Business Requirements", gateDue: "Mar 13, 2026"
  },
  timeline: {
    progressPct: 22,
    milestones: [
      { name: "Kickoff",       date: "Feb 24", status: "done"    },
      { name: "Biz Req Due",   date: "Mar 13", status: "current" },
      { name: "Discovery-End", date: "Mar 20", status: "future"  },
      { name: "Phase 1 End",   date: "Apr 24", status: "future"  },
      { name: "Phase 2",       date: "TBD",    status: "future"  },
      { name: "Phase 3",       date: "TBD",    status: "future"  }
    ]
  }
};

(function () {
  document.getElementById("hdr-week").textContent = DATA.meta.weekLabel;
  document.getElementById("hdr-date").textContent = DATA.meta.dataDate;

  function tick() {
    document.getElementById("live-clock").textContent =
      new Date().toLocaleTimeString("en-CA", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  }
  tick(); setInterval(tick, 1000);

  var cont = document.getElementById("charters");

  DATA.charters.forEach(function(c) {
    var total = c.done + c.active + c.delayed + c.todo;
    var pct   = total > 0 ? Math.round((c.done / total) * 100) : 0;
    var card  = document.createElement("div");
    card.className = "charter-card";

    var banner = document.createElement("div");
    banner.className = "sentiment-banner sent-" + c.sentiment;
    var bigDot = document.createElement("div");
    bigDot.className = "big-dot";
    banner.appendChild(bigDot);
    var sw = document.createElement("span");
    sw.className = "sentiment-word";
    sw.textContent = c.sentimentWord;
    banner.appendChild(sw);
    var chip = document.createElement("div");
    chip.className = "phase-chip";
    chip.textContent = "Phase 1 data cleanup";
    banner.appendChild(chip);
    card.appendChild(banner);

    var body = document.createElement("div");
    body.className = "card-body";

    var hd = document.createElement("div");
    var cn = document.createElement("div");
    cn.className = "charter-name"; cn.textContent = c.name;
    hd.appendChild(cn);
    var cl = document.createElement("div");
    cl.className = "charter-lead";
    cl.textContent = "Lead: " + c.lead + "  \u00b7  " + c.startDate + " \u2013 " + c.endDate;
    hd.appendChild(cl);
    body.appendChild(hd);

    var bb = document.createElement("div");
    bb.className = "blurb-block";
    var bl = document.createElement("div"); bl.className = "blurb-label"; bl.textContent = "Lead's Take";
    var bt = document.createElement("div"); bt.className = "blurb-text";  bt.textContent = c.blurb;
    bb.appendChild(bl); bb.appendChild(bt);
    body.appendChild(bb);

    var tg = document.createElement("div");
    tg.className = "task-grid";
    function makeCell(n, cls, lbl) {
      var cell = document.createElement("div"); cell.className = "task-cell";
      var num  = document.createElement("div"); num.className  = "task-count " + cls; num.textContent = String(n);
      var lab  = document.createElement("div"); lab.className  = "task-label"; lab.textContent = lbl;
      cell.appendChild(num); cell.appendChild(lab); return cell;
    }
    tg.appendChild(makeCell(c.done,    "c-done",    "Done"));
    tg.appendChild(makeCell(c.active,  "c-active",  "Active"));
    tg.appendChild(makeCell(c.delayed, "c-delayed", "Delayed"));
    tg.appendChild(makeCell(c.todo,    "c-todo",    "To Do"));
    body.appendChild(tg);

    var pw = document.createElement("div"); pw.className = "progress-wrap";
    var pm = document.createElement("div"); pm.className = "progress-meta";
    var pl = document.createElement("span"); pl.className = "progress-label"; pl.textContent = "Completion";
    var pp = document.createElement("span"); pp.className = "progress-pct";   pp.textContent = pct + "%";
    pm.appendChild(pl); pm.appendChild(pp); pw.appendChild(pm);
    var pb = document.createElement("div"); pb.className = "progress-bar";
    var pf = document.createElement("div"); pf.className = "progress-fill"; pf.style.width = pct + "%";
    pb.appendChild(pf); pw.appendChild(pb);
    body.appendChild(pw);

    var nw = document.createElement("div"); nw.className = "new-tasks";
    var nl = document.createElement("div"); nl.className = "new-tasks-label"; nl.textContent = "New This Week";
    nw.appendChild(nl);
    var tl = document.createElement("div"); tl.className = "task-list";
    if (c.newTasks && c.newTasks.length) {
      c.newTasks.forEach(function(t) {
        var ti = document.createElement("div"); ti.className = "task-item"; ti.textContent = t; tl.appendChild(ti);
      });
    } else {
      var ni = document.createElement("div"); ni.className = "task-item none"; ni.textContent = "No new tasks this week"; tl.appendChild(ni);
    }
    nw.appendChild(tl);
    body.appendChild(nw);

    card.appendChild(body);
    cont.appendChild(card);
  });

  var ae = DATA.americanEagle;
  document.getElementById("ae-phase").textContent = ae.phase;
  document.getElementById("ae-pct").textContent   = ae.completePct + "%";
  document.getElementById("ae-fill").style.width  = ae.completePct + "%";

  var sts = document.getElementById("ae-stats");
  function makeStat(val, lbl, ok) {
    var d = document.createElement("div"); d.className = "ae-stat";
    var s = document.createElement("strong"); s.textContent = val;
    if (ok) s.classList.add("on-track");
    d.appendChild(s); d.appendChild(document.createTextNode(" " + lbl)); return d;
  }
  sts.appendChild(makeStat(ae.schedule, "Schedule", true));
  sts.appendChild(makeStat(ae.scope,    "Scope",    true));
  sts.appendChild(makeStat(ae.budget,   "Budget",   true));
  sts.appendChild(makeStat(ae.hoursRemaining + " / " + ae.hoursTotal + " hrs", "Remaining", false));
  sts.appendChild(makeStat(ae.lead, "Lead", false));

  var gt = document.getElementById("ae-gate");
  var gs = document.createElement("strong"); gs.textContent = "Key Gate: "; gt.appendChild(gs);
  gt.appendChild(document.createTextNode(ae.gateLabel + " \u2014 "));
  var gd = document.createElement("strong"); gd.textContent = ae.gateDue; gt.appendChild(gd);

  document.getElementById("track-progress").style.width = DATA.timeline.progressPct + "%";
  var msr = document.getElementById("milestones");
  DATA.timeline.milestones.forEach(function(m) {
    var ms = document.createElement("div"); ms.className = "milestone";
    var mn = document.createElement("div"); mn.className = "milestone-name " + m.status; mn.textContent = m.name;
    var md = document.createElement("div"); md.className = "milestone-dot "  + m.status;
    var mdt= document.createElement("div"); mdt.className= "milestone-date " + m.status; mdt.textContent = m.date;
    ms.appendChild(mn); ms.appendChild(md); ms.appendChild(mdt);
    msr.appendChild(ms);
  });
})();
</script>
</body>
</html>
